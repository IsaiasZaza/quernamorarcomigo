<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quer casar comigo? 💍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
    color: #fff;
    background:
      radial-gradient(circle at 20% 15%, rgba(255, 105, 180, .45), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(160, 80, 255, .45), transparent 50%),
      radial-gradient(circle at 50% 50%, #3a0d33, #1a0518 80%);
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* Estrelinhas */
  #estrelas { position: fixed; inset: 0; pointer-events: none; }
  .estrela {
    position: absolute;
    width: 3px; height: 3px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 8px 2px rgba(255,255,255,.7);
    animation: brilho ease-in-out infinite;
  }
  @keyframes brilho {
    0%,100% { opacity: .15; transform: scale(.6); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  /* Corações subindo */
  #coracoes { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .coracao {
    position: absolute; bottom: -60px; opacity: 0;
    animation: subir linear forwards;
    filter: drop-shadow(0 0 8px rgba(255, 90, 160, .7));
  }
  @keyframes subir {
    0%   { transform: translate(0,0) rotate(0); opacity: 0; }
    10%  { opacity: .85; }
    100% { transform: translate(var(--dx), -115vh) rotate(var(--rot)); opacity: 0; }
  }

  /* Conteúdo central (sem caixa) */
  .cena {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    animation: entrada 1s cubic-bezier(.2,.9,.3,1.1) both;
  }
  @keyframes entrada {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: none; }
  }

  .coracao-grande {
    position: relative;
    width: 190px; height: 190px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 6px;
    animation: bater 1.3s ease-in-out infinite;
  }
  .coracao-grande svg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    filter: drop-shadow(0 0 25px rgba(255, 60, 140, .8));
  }
  .coracao-grande .rosto {
    position: relative; font-size: 70px; margin-top: -8px;
    transition: transform .2s;
  }
  .coracao-grande .rosto.pula { animation: pula .45s; }
  @keyframes bater {
    0%,100% { transform: scale(1); }
    15% { transform: scale(1.1); }
    30% { transform: scale(1); }
    45% { transform: scale(1.07); }
  }
  @keyframes pula {
    0%,100% { transform: translateY(0) rotate(0); }
    30% { transform: translateY(-14px) rotate(-12deg); }
    60% { transform: translateY(0) rotate(10deg); }
  }

  h1 {
    font-family: 'Great Vibes', cursive;
    font-weight: 400;
    font-size: clamp(54px, 13vw, 108px);
    line-height: 1.25;
    padding: 0 .15em .1em;
    margin: 0 0 6px;
    background: linear-gradient(90deg, #ffd1e8, #ff7ab8, #ffd1e8);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: brilhoTexto 4s linear infinite;
    filter: drop-shadow(0 4px 18px rgba(255, 80, 150, .55));
  }
  @keyframes brilhoTexto { to { background-position: 200% center; } }

  .sub {
    min-height: 28px;
    margin-bottom: 38px;
    font-size: clamp(15px, 3.8vw, 19px);
    color: #ffd9ec;
    letter-spacing: .3px;
    max-width: 440px;
  }

  .botoes {
    display: flex;
    gap: 26px;
    align-items: center;
    justify-content: center;
    flex-wrap: nowrap;
  }

  button {
    font-family: inherit;
    font-weight: 600;
    border: none;
    cursor: pointer;
    color: #fff;
    border-radius: 999px;
  }

  #sim {
    padding: 17px 50px;
    font-size: 21px;
    background: linear-gradient(135deg, #ff6aa8, #ff2d75);
    box-shadow: 0 0 0 0 rgba(255, 60, 140, .6), 0 12px 30px rgba(255, 45, 117, .5);
    animation: pulsoSim 1.5s ease-in-out infinite;
    transform: scale(var(--escala, 1));
    transition: transform .35s cubic-bezier(.2,.9,.3,1.4);
  }
  #sim:hover { filter: brightness(1.1); }
  @keyframes pulsoSim {
    0%   { box-shadow: 0 0 0 0 rgba(255, 60, 140, .55), 0 12px 30px rgba(255, 45, 117, .5); }
    70%  { box-shadow: 0 0 0 22px rgba(255, 60, 140, 0), 0 12px 30px rgba(255, 45, 117, .5); }
    100% { box-shadow: 0 0 0 0 rgba(255, 60, 140, 0), 0 12px 30px rgba(255, 45, 117, .5); }
  }

  /* Espaço reservado onde o "Não" nasce */
  #reserva { display: inline-block; }

  /* O botão NÃO fica sempre solto na tela, nunca preso em caixa nenhuma */
  #nao {
    position: fixed;
    left: 0; top: 0;
    z-index: 10;
    padding: 15px 36px;
    font-size: 18px;
    white-space: nowrap;
    background: rgba(255, 255, 255, .12);
    border: 1.5px solid rgba(255, 255, 255, .45);
    box-shadow: 0 8px 22px rgba(0,0,0,.3);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    touch-action: none;
    will-change: transform;
    visibility: hidden;
  }
  #nao.pronto { visibility: visible; }
  #nao.movendo { transition: transform .22s cubic-bezier(.25,.9,.35,1.25); }

  /* Sucesso */
  #sucesso {
    position: fixed; inset: 0; z-index: 20;
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
    background:
      radial-gradient(circle at 50% 40%, #ff5fa2, transparent 60%),
      linear-gradient(135deg, #ff7ab8, #b44cff);
  }
  #sucesso.ativo { display: flex; animation: entrada .8s both; }
  #sucesso .grande { font-size: 120px; animation: bater 1.1s infinite; filter: drop-shadow(0 0 25px rgba(255,255,255,.6)); }
  #sucesso h2 {
    font-family: 'Great Vibes', cursive; font-weight: 400;
    font-size: clamp(60px, 15vw, 130px); line-height: 1.05;
    text-shadow: 0 6px 30px rgba(106, 15, 58, .45);
  }
  #sucesso p { margin-top: 14px; font-size: clamp(16px, 4vw, 22px); max-width: 520px; }

  canvas#confete { position: fixed; inset: 0; z-index: 30; pointer-events: none; }
</style>
</head>
<body>

<div id="estrelas"></div>
<div id="coracoes"></div>

<main class="cena">
  <div class="coracao-grande">
    <svg viewBox="0 0 100 90" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ff8cc0"/>
          <stop offset="1" stop-color="#ff2d75"/>
        </linearGradient>
      </defs>
      <path fill="url(#g)" d="M50 86C20 62 3 46 3 27 3 13 14 3 27 3c9 0 18 5 23 13C55 8 64 3 73 3c13 0 24 10 24 24 0 19-17 35-47 59z"/>
    </svg>
    <span class="rosto" id="rosto">🥺</span>
  </div>

  <h1>Quer casar comigo?</h1>
  <p class="sub" id="sub">Tenho uma pergunta muito importante pra você... 💖</p>

  <div class="botoes">
    <button id="sim">Sim 💕</button>
    <span id="reserva"></span>
  </div>
</main>

<button id="nao" tabindex="-1" aria-hidden="true">Não 💔</button>

<section id="sucesso">
  <div class="grande">💍</div>
  <h2>Ela disse SIM!</h2>
  <p>Você me fez a pessoa mais feliz do mundo. Eu te amo muito! 💖✨</p>
</section>

<canvas id="confete"></canvas>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const sim = $('sim'), nao = $('nao'), reserva = $('reserva');
  const sub = $('sub'), rosto = $('rosto'), sucesso = $('sucesso');

  /* ---------- Estrelas ---------- */
  const areaEstrelas = $('estrelas');
  for (let i = 0; i < 70; i++) {
    const e = document.createElement('i');
    e.className = 'estrela';
    e.style.left = Math.random() * 100 + '%';
    e.style.top = Math.random() * 100 + '%';
    e.style.animationDuration = 2 + Math.random() * 4 + 's';
    e.style.animationDelay = Math.random() * 4 + 's';
    areaEstrelas.appendChild(e);
  }

  /* ---------- Corações ---------- */
  const areaCoracoes = $('coracoes');
  const emojis = ['💖','💗','💕','💘','💞','🌹','✨'];
  function criarCoracao() {
    const c = document.createElement('span');
    c.className = 'coracao';
    c.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    const dur = 7 + Math.random() * 7;
    c.style.left = Math.random() * 100 + 'vw';
    c.style.fontSize = 16 + Math.random() * 28 + 'px';
    c.style.animationDuration = dur + 's';
    c.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
    c.style.setProperty('--rot', (Math.random() * 120 - 60) + 'deg');
    areaCoracoes.appendChild(c);
    setTimeout(() => c.remove(), dur * 1000);
  }
  setInterval(criarCoracao, 450);
  for (let i = 0; i < 10; i++) setTimeout(criarCoracao, i * 180);

  /* ---------- Botão NÃO ---------- */
  const frases = [
    'Ei, onde você pensa que vai clicar? 😏',
    'Esse botão tá com defeito, tenta o outro! 😅',
    'Não consegue, né? 😂',
    'Tá difícil, hein... 💕',
    'Você sabe que quer clicar no SIM! 😘',
    'Desiste, o SIM é seu destino! 💍',
    'Quase! Quase... não 😜',
    'Meu coração não aguenta um "não" 🥺',
    'Olha o botão de SIM, tão lindinho! 💖'
  ];
  const carinhas = ['🥺','😏','😅','😂','😜','🤭','😘','🥰','😳'];

  let x = 0, y = 0;            // posição atual do botão (canto superior esquerdo)
  let tentativas = 0;
  let fugiu = false;
  let ultimaFala = 0;
  const MARGEM = 12;

  const tam = () => ({ w: nao.offsetWidth, h: nao.offsetHeight });
  const limites = () => {
    const { w, h } = tam();
    return { maxX: innerWidth - w - MARGEM, maxY: innerHeight - h - MARGEM };
  };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function posicionar(nx, ny) {
    x = nx; y = ny;
    nao.style.transform = `translate(${x}px, ${y}px)`;
  }

  // posição inicial: ao lado do SIM
  function colocarNoInicio() {
    const { w, h } = tam();
    reserva.style.width = w + 'px';
    reserva.style.height = h + 'px';
    const r = reserva.getBoundingClientRect();
    posicionar(r.left, r.top);
    nao.classList.add('pronto');
  }

  function sobrepoeSim(nx, ny) {
    const { w, h } = tam();
    const s = sim.getBoundingClientRect();
    const folga = 24;
    return !(nx + w < s.left - folga || nx > s.right + folga ||
             ny + h < s.top - folga  || ny > s.bottom + folga);
  }

  function falar() {
    const agora = Date.now();
    if (agora - ultimaFala < 450) return;
    ultimaFala = agora;
    tentativas++;
    sub.textContent = frases[Math.floor(Math.random() * frases.length)];
    rosto.textContent = carinhas[Math.floor(Math.random() * carinhas.length)];
    rosto.classList.remove('pula'); void rosto.offsetWidth; rosto.classList.add('pula');
    sim.style.setProperty('--escala', Math.min(1 + tentativas * 0.05, 1.6));
  }

  // Teletransporte para o ponto mais distante do ponteiro
  function pularLonge(px, py) {
    const { w, h } = tam();
    const { maxX, maxY } = limites();
    let melhor = null, melhorD = -1;
    for (let i = 0; i < 60; i++) {
      const nx = MARGEM + Math.random() * (maxX - MARGEM);
      const ny = MARGEM + Math.random() * (maxY - MARGEM);
      if (sobrepoeSim(nx, ny)) continue;
      const d = Math.hypot(nx + w / 2 - px, ny + h / 2 - py);
      if (d > melhorD) { melhorD = d; melhor = { nx, ny }; }
    }
    if (melhor) posicionar(melhor.nx, melhor.ny);
  }

  // O ponteiro "empurra" o botão para longe
  function reagir(px, py) {
    if (!fugiu) { fugiu = true; nao.classList.add('movendo'); }
    const { w, h } = tam();
    const { maxX, maxY } = limites();
    const cx = x + w / 2, cy = y + h / 2;
    let dx = cx - px, dy = cy - py;
    let d = Math.hypot(dx, dy) || 1;
    dx /= d; dy /= d;

    const passo = 150 + Math.random() * 60;
    let nx = x + dx * passo;
    let ny = y + dy * passo;

    const encurralado = nx < MARGEM || nx > maxX || ny < MARGEM || ny > maxY;
    nx = clamp(nx, MARGEM, maxX);
    ny = clamp(ny, MARGEM, maxY);

    if (encurralado || sobrepoeSim(nx, ny)) {
      pularLonge(px, py);
    } else {
      posicionar(nx, ny);
    }
    falar();
  }

  const perto = (px, py) => {
    const r = nao.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const raio = Math.max(r.width, r.height) / 2 + 55;
    return Math.hypot(px - cx, py - cy) < raio;
  };

  document.addEventListener('pointermove', (e) => {
    if (perto(e.clientX, e.clientY)) reagir(e.clientX, e.clientY);
  });
  document.addEventListener('pointerdown', (e) => {
    if (perto(e.clientX, e.clientY)) reagir(e.clientX, e.clientY);
  });

  // Nunca deixa clicar no NÃO
  const bloquear = (e) => {
    e.preventDefault();
    e.stopPropagation();
    const p = e.touches ? e.touches[0] : e;
    reagir(p ? p.clientX : innerWidth / 2, p ? p.clientY : innerHeight / 2);
  };
  ['pointerenter','pointerdown','mousedown','touchstart','click','focus','mouseover','keydown']
    .forEach(ev => nao.addEventListener(ev, bloquear, { passive: false }));

  window.addEventListener('resize', () => {
    if (!fugiu) { colocarNoInicio(); return; }
    const { maxX, maxY } = limites();
    posicionar(clamp(x, MARGEM, maxX), clamp(y, MARGEM, maxY));
  });

  // espera as fontes para medir certo
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
    requestAnimationFrame(colocarNoInicio);
  });
  window.addEventListener('load', () => { if (!fugiu) colocarNoInicio(); });

  /* ---------- SIM ---------- */
  sim.addEventListener('click', () => {
    nao.style.display = 'none';
    sucesso.classList.add('ativo');
    iniciarConfete();
    for (let i = 0; i < 40; i++) setTimeout(criarCoracao, i * 60);
  });

  /* ---------- Confete ---------- */
  const canvas = $('confete');
  const ctx = canvas.getContext('2d');
  let pecas = [], rodando = false;
  const ajustar = () => { canvas.width = innerWidth; canvas.height = innerHeight; };
  ajustar(); addEventListener('resize', ajustar);

  function nova(p) { pecas.push(p); }
  function iniciarConfete() {
    const cores = ['#ff4d8d','#ffd166','#ffffff','#c471ed','#ff9ec4','#ffb703'];
    const cor = () => cores[Math.floor(Math.random() * cores.length)];
    for (let i = 0; i < 260; i++) {
      nova({
        x: innerWidth / 2, y: innerHeight / 2,
        vx: (Math.random() - .5) * 24, vy: (Math.random() - .8) * 24,
        g: .35 + Math.random() * .2, s: 6 + Math.random() * 8,
        r: Math.random() * Math.PI, vr: (Math.random() - .5) * .4,
        cor: cor(), coracao: Math.random() < .3
      });
    }
    if (!rodando) { rodando = true; animar(); }
    let n = 0;
    const chuva = setInterval(() => {
      for (let i = 0; i < 8; i++) {
        nova({
          x: Math.random() * innerWidth, y: -20,
          vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 3,
          g: .05, s: 6 + Math.random() * 8,
          r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
          cor: cor(), coracao: Math.random() < .4
        });
      }
      if (++n > 150) clearInterval(chuva);
    }, 60);
  }

  function animar() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of pecas) {
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.vx *= .995;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.r);
      ctx.fillStyle = p.cor;
      if (p.coracao) { ctx.font = p.s * 2 + 'px serif'; ctx.fillText('❤', -p.s, p.s); }
      else ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      ctx.restore();
    }
    pecas = pecas.filter(p => p.y < canvas.height + 40);
    if (pecas.length) requestAnimationFrame(animar); else rodando = false;
  }
})();
</script>
</body>
</html>
